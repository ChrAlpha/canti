name: Set up cached Go
description: Use setup-go's native cache with separate compiler modes
inputs:
  scope:
    description: Compiler mode (standard, race, integration, or pty)
    required: true
runs:
  using: composite
  steps:
    - name: Select compiler cache
      shell: bash
      env:
        SCOPE: ${{ inputs.scope }}
      # The cache archive version includes GOCACHE's path, isolating modes even
      # though setup-go uses the same dependency key. Keep paths stable per mode.
      run: echo "GOCACHE=$RUNNER_TEMP/go-build-$SCOPE" >> "$GITHUB_ENV"
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version: '1.25.x'
        cache: true
        cache-dependency-path: |
          runtime/go.sum
          sdk/go/go.sum
          apps/tui/go.sum
          go.work.sum
